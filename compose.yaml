name: docker-recisdb-epgstation-konomitv
services:
  recisdb-proxy:
    build:
      context: .
      dockerfile: docker/recisdb-proxy/Dockerfile
      args:
        RECISDB_REPO: ${RECISDB_REPO}
        RECISDB_REF: ${RECISDB_REF}
    restart: unless-stopped
    # Match the host owner of data/recisdb and config/recisdb-proxy (set by setup.sh).
    user: "${RUN_UID:-1000}:${RUN_GID:-1000}"
    environment:
      TZ: ${TZ}
    group_add:
      - "${VIDEO_GID:-44}"
    volumes:
      - ./data/recisdb:/data
      # Host-editable settings created by setup.sh. Read-write: recisdb-proxy rewrites it for preview setup.
      - ./config/recisdb-proxy/recisdb-proxy.toml:/data/recisdb-proxy.toml
    ports:
      - "${RECISDB_WEB_PORT}:40080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:40080/mirakurun/api/status >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  epgstation:
    build:
      context: .
      dockerfile: docker/epgstation/Dockerfile
      args:
        EPGSTATION_REPO: ${EPGSTATION_REPO}
        EPGSTATION_REF: ${EPGSTATION_REF}
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      TMPDIR: /app/data/tmp
    depends_on:
      recisdb-proxy:
        condition: service_healthy
      mariadb:
        condition: service_healthy
    volumes:
      # Host-editable settings created by setup.sh (regenerate with make regen-config SERVICE=epgstation).
      - ./config/epgstation/config.yml:/app/config/config.yml
      - ${RECORDED_DIR}:/recorded
      - ./data/epgstation:/app/data
      - ./data/epgstation-logs:/app/logs
      - ./data/epgstation-thumbnail:/app/thumbnail
      - ./data/epgstation-drop:/app/drop
    ports:
      - "${EPGSTATION_PORT}:8888"

  konomitv:
    build:
      context: ${KONOMITV_SOURCE:-../KonomiTV}
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      TZ: ${TZ}
    depends_on:
      recisdb-proxy:
        condition: service_healthy
    volumes:
      # Host-editable settings created by setup.sh. Read-write: KonomiTV saves its settings here.
      - ./config/konomitv/config.yaml:/code/config.yaml
      - ${RECORDED_DIR}:/host-rootfs/recorded:ro
      - ./data/konomitv:/code/server/data
      - ./data/konomitv-logs:/code/server/logs
    ports:
      - "${KONOMITV_PORT}:7000"

  mariadb:
    image: mariadb:latest
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_general_ci"]
    restart: unless-stopped
    environment:
      MARIADB_AUTO_UPGRADE: "1"
      MARIADB_DATABASE: epgstation
      MARIADB_USER: epgstation
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Run setup.sh first}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Run setup.sh first}
      TZ: ${TZ}
    volumes:
      - ./data/mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
