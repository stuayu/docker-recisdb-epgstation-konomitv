services:
  https-gateway:
    build:
      context: .
      dockerfile: docker/https-gateway/Dockerfile
      args:
        AKEBI_REPO: ${AKEBI_REPO:-https://github.com/tsukumijima/Akebi.git}
        AKEBI_REF: ${AKEBI_REF:-8ddba6a29b858567ab286b5d31daebf2ff683e94}
    restart: unless-stopped
    environment:
      AKEBI_ROUTES: "40443=http://recisdb-proxy:40080/ 8443=http://epgstation:8888/"
      AKEBI_KEYLESS_SERVER_URL: ${AKEBI_KEYLESS_SERVER_URL:-https://akebi.konomi.tv/}
    depends_on:
      recisdb-proxy:
        condition: service_healthy
      epgstation:
        condition: service_started
    ports:
      - "${RECISDB_HTTPS_PORT:-40443}:40443"
      - "${EPGSTATION_HTTPS_PORT:-8443}:8443"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "40443"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s
