services:
  epgstation:
    build:
      args:
        INSTALL_AMATSUKAZE: "1"
        AMATSUKAZE_VERSION: ${AMATSUKAZE_VERSION:-1.1.1.2}
    environment:
      AMATSUKAZE_ENABLED: "1"
      RUN_UID: ${RUN_UID:-1000}
      RUN_GID: ${RUN_GID:-1000}
    depends_on:
      amatsukaze:
        condition: service_started

  amatsukaze:
    # 1.1.1.2 server + bundled encoders are published for x86_64 only.
    platform: linux/amd64
    build:
      context: .
      dockerfile: docker/amatsukaze/Dockerfile
      args:
        AMATSUKAZE_VERSION: ${AMATSUKAZE_VERSION:-1.1.1.2}
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Tokyo}
      RUN_UID: ${RUN_UID:-1000}
      RUN_GID: ${RUN_GID:-1000}
    ports:
      - "${AMATSUKAZE_WEBUI_PORT:-32769}:32769"
    expose:
      - "32768"
    volumes:
      - ${RECORDED_DIR}:/recorded
      - ./data/amatsukaze/avs:/app/avs
      - ./data/amatsukaze/bat:/app/bat
      - ./data/amatsukaze/config:/app/config
      - ./data/amatsukaze/data:/app/data
      - ./data/amatsukaze/drcs:/app/drcs
      - ./data/amatsukaze/JL:/app/JL
      - ./data/amatsukaze/logo:/app/logo
      - ./data/amatsukaze/profile:/app/profile
      - ./data/amatsukaze/input:/app/input
      - ./data/amatsukaze/output:/app/output
